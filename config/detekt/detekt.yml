# Adds to detekt's defaults (buildUponDefaultConfig). Only deviations are listed, each with a reason.
style:
  MagicNumber:
    # Compose UI code is full of dp/alpha literals; domain code is where magic numbers really hurt.
    excludes: ['**/presentation/**', '**/designsystem/**', '**/test/**', '**/androidTest/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreExtensionFunctions: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  WildcardImport:
    active: false
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    # Composables take many parameters (state + callbacks + modifier).
    allowedFunctionParameters: 9
    # Constructor-injected classes take one collaborator per use-case/repository (Dagger wires them), so @Inject constructors are exempt.
    allowedConstructorParameters: 7
    ignoreAnnotated: ['Composable', 'Inject']
  LongMethod:
    allowedLines: 79
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 19
    allowedFunctionsPerClass: 19
    ignoreAnnotatedFunctions: ['Composable']
  NestedBlockDepth:
    allowedDepth: 4
exceptions:
  TooGenericExceptionCaught:
    # ViewModels deliberately catch Exception so a raw SQLiteException cannot crash viewModelScope (see MapViewModel).
    active: false
