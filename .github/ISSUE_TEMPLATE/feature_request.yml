name: Feature idea
description: Suggest something WifiLens could do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work.
  - type: markdown
    attributes:
      value: |
        WifiLens stays offline, account-free and ad-free. Ideas that need a server, an account, cloud sync or
        background location are out of scope (see DEVELOPMENT.md → Out of scope).
