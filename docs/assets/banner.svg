<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">WifiLens</title>
  <desc id="d">See where your Wi-Fi reaches. The WifiLens grid logo with signal waves spreading from the router tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F72E0"/>
      <stop offset="1" stop-color="#1B47A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- Signal waves spreading from the router dot -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3">
      <circle cx="252" cy="118" r="20" opacity="0">
        <animate attributeName="r" values="20;420" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="252" cy="118" r="20" opacity="0">
        <animate attributeName="r" values="20;420" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="252" cy="118" r="20" opacity="0">
        <animate attributeName="r" values="20;420" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="252" cy="118" r="90" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Logo grid: tiles light up as the signal reaches them, nearest first -->
    <g>
      <circle cx="252" cy="118" r="32" fill="#FFFFFF"/>
      <rect x="302" y="86" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.95;0.8" dur="3s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="382" y="86" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="166" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.95;0.8" dur="3s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="302" y="166" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="382" y="166" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.6;0.32" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="246" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="302" y="246" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.6;0.32" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="382" y="246" width="64" height="64" rx="14" fill="#FFFFFF" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.45;0.2" dur="3s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Wordmark -->
    <g font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
      <text x="530" y="176" font-size="96" font-weight="700" letter-spacing="-1">WifiLens</text>
      <text x="534" y="232" font-size="34" font-weight="500">See where your Wi-Fi reaches.</text>
      <text x="534" y="278" font-size="24" opacity="0.85">Free · offline · no account · no ads</text>
    </g>
  </g>
</svg>
